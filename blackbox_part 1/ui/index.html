<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Box</title>
<style>
:root{
  --bg:#0d0d0e; --panel:#161618; --panel2:#1d1d20; --hover:#222226; --line:#2a2a2e; --line2:#37373c;
  --text:#ededee; --text2:#b9b9be; --muted:#85858c;
  --accent:#3987e5; --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s0:#6b6b72;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2d2d32;border-radius:6px;border:2px solid var(--panel)}
::-webkit-scrollbar-track{background:transparent}
#app{display:flex;height:100vh;gap:8px;padding:8px}
.rail{width:158px;flex:none;display:flex;flex-direction:column;gap:2px;padding:6px}
.brand{display:flex;align-items:center;gap:9px;padding:10px 10px 14px;font-weight:700;font-size:14px;letter-spacing:.2px}
.brand i{flex:none;width:20px;height:20px;border-radius:5px;background:#000;border:1.5px solid var(--text);display:block;position:relative}
.brand i:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--crit)}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:10.5px;letter-spacing:0}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--text2);border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);font-weight:600}
a{color:#7fb2f0} a:hover{color:#a9cdfb}
.kbadge{margin-left:auto;background:#1f7a52;color:#fff;border-radius:999px;font-size:11px;padding:0 7px;font-weight:600}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail .grow{flex:1}
.primary{background:#1f7a52;border:1px solid #2a9a69;color:#fff;font-weight:650;border-radius:8px;padding:9px 12px}
.primary:hover{background:#249062}
.primary:disabled{opacity:.55;cursor:default}
.svc{padding:10px;color:var(--muted);font-size:11.5px;display:grid;gap:5px}
.svc b{color:var(--text2);font-weight:500}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.up{background:var(--good)} .dot.down{background:var(--serious)}
.side{width:262px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto}
.search{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:7px 10px;outline:none}
.search:focus,.inp:focus{border-color:var(--accent)}
.side h4{margin:18px 6px 6px;font-size:10.5px;letter-spacing:.9px;color:var(--muted);font-weight:650;text-transform:uppercase}
.chan{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:6px 8px;border-radius:7px;color:var(--text2);text-align:left}
.chan:hover{background:var(--hover);color:var(--text)}
.chan.on{background:#000;color:var(--text);font-weight:600}
.chan .h{color:var(--muted);width:12px;text-align:center;flex:none}
.chan .sw{width:10px;height:10px;border-radius:3px;flex:none}
.chan .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cnt.red{background:var(--crit);color:#fff;border-radius:9px;padding:0 7px;font-weight:650}
.main{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
.top h1{font-size:16px;margin:0;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inp,select.inp{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;outline:none}
textarea.inp{width:100%;font-family:var(--mono);font-size:12px;resize:vertical}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:6px 11px;color:var(--text)}
.btn:hover{background:var(--hover)} .btn.sm{padding:3px 9px;font-size:12px}
.split{flex:1;display:flex;min-height:0}
.col{overflow:auto;min-width:0}
.threads{flex:1.35;border-right:1px solid var(--line)}
.over{flex:1;padding:0 16px 20px}
.sub{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-weight:650}
.sub .sp{flex:1}.sub label,.sub select{font-weight:400;font-size:12px;color:var(--text2)}
.thr{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 16px;color:var(--text)}
.thr:hover{background:var(--hover)}
.thr .l1{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.thr .t{font-weight:650;font-size:13.5px;margin:5px 0 3px}
.thr .sum{color:var(--text2);margin:3px 0}
.thr .l3{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px;margin-top:6px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:700;border-radius:9px;padding:1px 8px;border:1px solid;letter-spacing:.3px;white-space:nowrap}
.badge.fail{color:#ff8f8f;border-color:#7a2626;background:#3a1414}
.badge.ok{color:#7fdc7f;border-color:#1d5c1d;background:#102b10}
.st{display:inline-flex;align-items:center;gap:6px;color:var(--text2)}
.st i{width:13px;height:13px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;color:#0d0d0e}
.st.good i{background:var(--good)} .st.warn i{background:var(--warn)} .st.open i{background:var(--serious)} .st.info i{background:var(--accent)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;margin:0 4px 3px 0;background:#2a2a2f;color:var(--text2);white-space:nowrap}
.chip.err{background:#4a1b1b;color:#ffb0b0}.chip.sus{background:#4a3410;color:#ffd58a}.chip.edit{background:#16365f;color:#a9cdfb}
.chip.reused{background:#143a22;color:#9be0b1}.chip.rerun{background:#4a3410;color:#ffd58a}.chip.edited{background:#16365f;color:#a9cdfb}
.more{display:block;margin:14px auto;}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
/* overview */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 4px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-width:0}
.tile .k{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:19px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .v small{font-size:12px;color:var(--muted);font-weight:400}
.chart{border-top:1px solid var(--line);margin:14px -16px 0;padding:14px 16px 0}
.chart:first-of-type{border-top:0}
.chart h3{margin:0 0 2px;font-size:13px;font-weight:650}
.chart p{margin:0 0 6px;color:var(--muted);font-size:11.5px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--text2);margin-bottom:4px}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:5px}
svg text{fill:var(--muted);font-size:10.5px;font-family:inherit}
#tip{position:fixed;z-index:50;pointer-events:none;background:#000;border:1px solid var(--line2);border-radius:7px;padding:7px 10px;font-size:12px;display:none;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#tip b{display:block;margin-bottom:3px}#tip div{display:flex;gap:12px;justify-content:space-between;color:var(--text2)}
#tip div span:first-child:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:6px}
/* detail */
.page{flex:1;overflow:auto;padding:16px}
.dgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.cap{color:var(--muted);font-size:12px;margin:4px 0}
.step{border:1px solid var(--line2);border-radius:9px;padding:8px 11px;margin-bottom:7px;cursor:pointer;background:var(--panel)}
.step:hover{border-color:#55555c}
.step.sus{border-color:#b9731a;background:#241a0c}
.step.sus2{border-color:#6b4a1c;border-style:dashed}
.step.sel{box-shadow:0 0 0 2px var(--accent)}
.step .hd{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
.step .hd b{font-size:13px}.step .hd .dep{color:var(--muted);font-size:11.5px}.step .hd .x{margin-left:auto;color:var(--muted);font-size:11.5px}
.mono{font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word;color:var(--text2)}
.io{margin-top:8px;border-top:1px dashed var(--line2);padding-top:8px}
.io h5{margin:6px 0 3px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.io .mono{background:#0b0b0c;border-radius:6px;padding:8px;max-height:260px;overflow:auto}
.susrow{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-bottom:7px;cursor:pointer;background:var(--panel)}
.susrow:hover{border-color:#55555c}
.bar{height:6px;border-radius:3px;background:#2c2c31;margin:6px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--serious);border-radius:3px}
.bar.g i{background:var(--good)}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.seg button{background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:5px 10px;color:var(--text2)}
.seg button.on{background:#16365f;border-color:#2f6ab8;color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.note{border-radius:8px;padding:8px 11px;margin:8px 0;font-size:12.5px}
.note.ok{background:#102b10;border:1px solid #1d5c1d;color:#a8e6a8}.note.bad{background:#3a1414;border:1px solid #7a2626;color:#ffb5b5}
.note.warn{background:#3a2c0c;border:1px solid #7a5c14;color:#ffdf9a}
details summary{cursor:pointer;color:var(--text2);font-size:12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:7px}
.cmp .step{cursor:default;margin:0}
.cmp .changed{border-left:4px solid var(--warn)}.cmp .added{border-left:4px solid var(--good)}.cmp .removed{border-left:4px solid var(--crit)}.cmp .same{opacity:.6}
.del{background:rgba(208,59,59,.35);text-decoration:line-through}.ins{background:rgba(12,163,12,.35)}
.mtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
/* results */
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:40}
.modal.on{display:grid}
.modal .box{width:520px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:18px}
.modal label{display:block;color:var(--text2);font-size:12px;margin:10px 0 4px}
.modal .inp{width:100%}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--text);border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
@media (max-width:1150px){.side{display:none}.dgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <nav class="rail">
    <div class="brand"><i></i><div>Black Box<small>agent flight recorder</small></div></div>
    <button class="nav" data-go="#/"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</button>
    <button class="nav" data-go="#/results"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Results</button>
    <button class="nav" data-go="#/custom"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h3M11 12h9M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Custom</button>
    <button class="nav" data-go="#/keys"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg>API keys<span class="kbadge" id="keyBadge" style="display:none"></span></button>
    <div class="grow"></div>
    <div class="svc" id="svc"></div>
    <button class="primary" id="recBtn">+ Record a run</button>
  </nav>
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<div id="tip"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (t, n = 110) => { t = String(t ?? "").replace(/\n/g, " ⏎ "); return t.length <= n ? t : t.slice(0, n) + "…"; };
const fmtN = n => n >= 10000 ? (n / 1000).toFixed(0) + "k" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
const fmtTime = iso => iso ? new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
const chip = (t, c = "") => `<span class="chip ${c}">${esc(t)}</span>`;
async function api(path, body) {
  const headers = {}, kh = keysHeader();               // the visitor's own API keys (API keys page)
  if (kh) headers["X-Blackbox-Keys"] = kh;
  if (body) headers["Content-Type"] = "application/json";
  const r = await fetch(path, body ? { method: "POST", headers, body: JSON.stringify(body) } : { headers });
  if (!r.ok) { let m = r.statusText; try { const j = await r.json(); m = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); } catch (e) {} throw new Error(m); }
  return r.json();
}

const S = { runs: [], replays: [], meta: null, diag: {}, limit: 60, sort: "new", lookback: "all",
            f: { q: "", outcome: null, status: null, fault: null, model: null, framework: null } };
const LOOKBACK = { all: ["All time", Infinity], "24h": ["Last 24 hours", 864e5], "6h": ["Last 6 hours", 216e5], "1h": ["Last hour", 36e5] };
const NOFAULT = "no injected fault";
const faultColor = f => { const i = S.meta.fault_types.indexOf(f); return i < 0 ? "var(--s0)" : `var(--s${i + 1})`; };

function runStatus(r) {
  if (r.outcome === "success") return { key: "ok", cls: "good", icon: "✓", text: "Succeeded" };
  if (r.confirmed) return { key: "confirmed", cls: "good", icon: "✓", text: "Cause confirmed and saved" };
  if (r.n_replays_ok > 0) return { key: "fixed", cls: "good", icon: "✓", text: "Fixed by replay" };
  if (r.n_replays > 0) return { key: "open", cls: "warn", icon: "!", text: "Replayed, still failing" };
  return { key: "open", cls: "open", icon: "!", text: "Open" };
}
function inLookback() {
  const span = LOOKBACK[S.lookback][1], now = Date.now();
  return S.runs.filter(r => span === Infinity || now - new Date(r.created_at) <= span);
}
function filtered() {
  const f = S.f, q = f.q.trim().toLowerCase();
  return inLookback().filter(r =>
    (!f.outcome || r.outcome === f.outcome) && (!f.status || runStatus(r).key === f.status) &&
    (!f.fault || (r.fault_type || NOFAULT) === f.fault) && (!f.model || r.model === f.model) &&
    (!f.framework || r.framework === f.framework) &&
    (!q || `${r.run_id} ${r.task} ${r.model} ${r.fault_type || ""} ${r.framework}`.toLowerCase().includes(q)));
}

/* ------------------------------------------------------------ sidebar */
function renderSide() {
  const base = inLookback(), count = (fn) => base.filter(fn).length, f = S.f;
  const row = (group, val, label, n, lead, red) =>
    `<button class="chan ${f[group] === val ? "on" : ""}" data-g="${group}" data-v="${esc(val ?? "")}">${lead}<span class="nm">${esc(label)}</span><span class="cnt ${red ? "red" : ""}">${n}</span></button>`;
  const hash = '<span class="h">#</span>', uniq = k => [...new Set(base.map(r => r[k]))].sort();
  const open = count(r => runStatus(r).key === "open");
  let h = `<input class="search" id="q" placeholder="Search runs, tasks, models" value="${esc(f.q)}">
    <div style="height:10px"></div>` + row("status", "open", "Open failures", open, '<span class="h">!</span>', open > 0) +
    `<h4>Outcome</h4>` + row("outcome", null, "all-runs", base.length, hash) + row("outcome", "fail", "failed", count(r => r.outcome === "fail"), hash) +
    row("outcome", "success", "succeeded", count(r => r.outcome === "success"), hash) +
    `<h4>Status</h4>` + row("status", "fixed", "fixed-by-replay", count(r => runStatus(r).key === "fixed"), hash) +
    row("status", "confirmed", "cause-confirmed", count(r => runStatus(r).key === "confirmed"), hash) +
    `<h4>Injected fault</h4>`;
  for (const t of [...S.meta.fault_types, NOFAULT])
    h += row("fault", t, t, count(r => (r.fault_type || NOFAULT) === t), `<span class="sw" style="background:${faultColor(t)}"></span>`);
  h += `<h4>Models</h4>` + uniq("model").map(m => row("model", m, m, count(r => r.model === m), hash)).join("");
  h += `<h4>Framework</h4>` + uniq("framework").map(m => row("framework", m, m, count(r => r.framework === m), hash)).join("");
  const side = $("#side"), keep = document.activeElement && document.activeElement.id === "q", pos = keep && $("#q").selectionStart;
  side.innerHTML = h;
  if (keep) { $("#q").focus(); $("#q").setSelectionRange(pos, pos); }
  $("#q").oninput = e => { S.f.q = e.target.value; S.limit = 60; renderThreads(); renderOverview(); };
  $$(".chan", side).forEach(b => b.onclick = () => {
    const g = b.dataset.g, v = b.dataset.v || null;
    S.f[g] = S.f[g] === v ? null : v; S.limit = 60;
    if (location.hash.replace(/^#\/?/, "")) location.hash = "#/"; else renderActivity();
  });
}

/* ------------------------------------------------------------ activity */
function renderActivity() {
  renderSide();
  $("#main").innerHTML = `<div class="top"><h1>Activity</h1><span class="cap">Lookback</span>
      <select class="inp" id="lb">${Object.entries(LOOKBACK).map(([k, v]) => `<option value="${k}" ${k === S.lookback ? "selected" : ""}>${v[0]}</option>`).join("")}</select></div>
    <div class="split"><div class="col threads"><div class="sub">Runs <span class="cnt" id="tcount"></span><span class="sp"></span>
        <label>Sort</label><select class="inp" id="sort">
          <option value="new">Newest</option><option value="old">Oldest</option><option value="tok">Most tokens</option><option value="steps">Most steps</option><option value="rep">Most replays</option></select></div>
        <div id="tlist"></div></div>
      <div class="col over"><div class="sub" style="margin:0 -16px">Overview <span class="sp"></span><span class="cap" id="ocap"></span></div><div id="ov"></div></div></div>`;
  $("#sort").value = S.sort;
  $("#sort").onchange = e => { S.sort = e.target.value; renderThreads(); };
  $("#lb").onchange = e => { S.lookback = e.target.value; S.limit = 60; renderActivity(); };
  renderThreads(); renderOverview();
}

const SORTS = { new: (a, b) => (b.created_at || "").localeCompare(a.created_at || "") || b.run_id.localeCompare(a.run_id),
  old: (a, b) => (a.created_at || "").localeCompare(b.created_at || "") || a.run_id.localeCompare(b.run_id),
  tok: (a, b) => b.tokens - a.tokens, steps: (a, b) => b.n_steps - a.n_steps, rep: (a, b) => b.n_replays - a.n_replays };
let io = null;
function diagLine(d) {
  const s = d.suspects[0];
  if (!s) return "No suspect returned";
  return `Top suspect: <b>step ${s.step_no}</b> · ${esc(s.actor || "")} · ${Math.round(s.confidence * 100)}% &nbsp;` +

    full: i => new Date(start + i * size).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + (day ? "" : " – " + new Date(start + (i + 1) * size).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })) };

function wdiff(a, b, limit = 600) {

  while (i < n || j < m) {

    else if (j < m && (i === n || dp[i * w + j + 1] >= dp[(i + 1) * w + j])) R += `<span class="ins">${esc(Bt[j++])}</span>`;
    else L += `<span class="del">${esc(A[i++])}</span>`;

}

const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, '<span class="mono">$1</span>');
const isNum = s => /^\**[\d.,]+%?( \([A-Z]+\))?\**$/.test(s);
async function renderResults() {
  const main = $("#main");

  const t0 = R.sections[0] && R.sections[0].tables[0], prf = (R.sections.find(s => /Precision/.test(s.title)) || { tables: [] }).tables[0];
  const find = (set, meth) => t0 && t0.rows.filter(r => r[0].startsWith(set) && meth.test(r[2])).sort((a, b) => b[1] - a[1])[0];
  const tiles = [];
  const a = find("REAL, seen setup", /^Black Box model \(simulated \+/), b = find("SIMULATED, unseen setup", /^Black Box model$/), c = find("REAL, seen setup", /^Heuristic/);
  if (b) tiles.push(["Top-1, simulated unseen setup", b[3], `top-3 ${b[4]} · ${b[1]} runs`]);
  if (a) tiles.push(["Top-1, real held-out tasks", a[3], `top-3 ${a[4]} · ${a[1]} runs`]);

  if (prf) { const r = prf.rows.find(r => r[0].startsWith("REAL")); if (r) tiles.push(["Per-step F1, real held-out", r[4], `precision ${r[2]} · recall ${r[3]}`]); }

    h += `<div class="card"><h3>Top-1 accuracy by method</h3><div class="cap" style="margin-bottom:8px">Share of failed runs where the first suspect is the truly faulty step. Full-size test sets only; the small LLM-judge samples are in the table below.</div>` +
      sets.map(set => { const rows = t0.rows.filter(r => r[0] === set), mx = Math.max(...rows.map(r => +r[1]));
        return `<div style="margin:12px 0 4px;font-weight:600">${esc(set)} <span class="cap">· ${mx} runs</span></div>` + rows.filter(r => +r[1] === mx).map(r =>
          `<div style="display:grid;grid-template-columns:minmax(150px,300px) 1fr 52px;gap:10px;align-items:center;margin:3px 0"><span class="cap" style="margin:0">${esc(r[2])}</span>
           <div class="bar" style="height:10px;margin:0"><i style="width:${parseFloat(r[3])}%;background:${col(r[2])};border-radius:0 4px 4px 0"></i></div><b class="n" style="text-align:right">${esc(r[3])}</b></div>`).join(""); }).join("") + `</div>`;
  }
  for (const s of R.sections) {
    h += `<div class="card">${s.title ? `<h3>${md(s.title)}</h3>` : `<h3>${md(R.title)}</h3>`}${s.text.map(p => `<p class="cap" style="font-size:12.5px">${md(p)}</p>`).join("")}` +
      s.tables.map(t => `${t.caption ? `<div style="margin:12px 0 4px;font-weight:600">${md(t.caption)}</div>` : ""}<div class="tw"><table><tr>${t.headers.map((x, i) => `<th class="${t.rows[0] && isNum(t.rows[0][i] || "") ? "n" : ""}">${md(x)}</th>`).join("")}</tr>

      </div>`; }).join("")}
  </div></div>`;
  $("#kremember").onchange = e => { KEYS.remember = e.target.checked; keysSave(); };
  $$("#main [data-p]").forEach(card => {
    const p = card.dataset.p, x = PROVIDERS.find(y => y.p === p), f = n => card.querySelector(`[data-f="${n}"]`);
    card.querySelector('[data-a="show"]').onclick = e => { const i = f("key"); i.type = i.type === "password" ? "text" : "password"; e.target.textContent = i.type === "password" ? "Show" : "Hide"; };
    const del = card.querySelector('[data-a="del"]');
    if (del) del.onclick = async () => { delete KEYS.p[p]; keysSave(); fillModelList(); await loadMeta().catch(() => {}); renderKeys(); };
    if (f("model")) f("model").onchange = e => { KEYS.p[p].model = e.target.value; keysSave(); fillModelList(); loadMeta().catch(() => {}); };
    card.querySelector('[data-a="test"]').onclick = async e => {
      const key = f("key").value.trim(), base = x.base ? f("base").value.trim() : null, b = e.target;
      if (!key) { f("msg").innerHTML = `<div class="note bad">Paste a key first.</div>`; return; }
      b.disabled = true; b.innerHTML = '<span class="spin"></span>Testing…';
      let r; try { r = await api("/api/keys/check", { provider: p, key, base_url: base }); } catch (err) { r = { ok: false, error: err.message, models: [] }; }
      const prev = KEYS.p[p] || {};
      KEYS.p[p] = { key, base: base || undefined, ok: r.ok, models: r.models && r.models.length ? r.models : (prev.key === key ? prev.models : []) || [],
                    model: prev.model };
      if (!r.ok && !r.models.length && prev.key !== key) KEYS.p[p].models = [];
      keysSave(); fillModelList(); await loadMeta().catch(() => {});
      renderKeys();
      const msg = $(`#main [data-p="${p}"] [data-f="msg"]`);
      if (msg) msg.innerHTML = r.ok ? `<div class="note ok">Key works${r.models.length ? ` · ${r.models.length} models found` : ""}. ${r.error ? esc(r.error) : "Saved in this browser."}</div>`
                                    : `<div class="note bad">${esc(r.error || "The key did not work.")} It is saved anyway; fix it or remove it.</div>`;
    };
  });
}

/* ------------------------------------------------------------ record modal */
function openRecord() {
  const m = S.meta;
  $("#modalBox").innerHTML = `<h3 style="margin:0 0 4px">Record a new run</h3><div class="cap">Runs the agent on a task and records every step. mock-* models run offline.</div>
    <label>Task</label><select class="inp" id="rt">${m.tasks.map(t => `<option value="${t.task_id}">${t.task_id}${t.demo ? " ★" : ""} · ${esc(t.text)}</option>`).join("")}</select>
    <label>Model</label><div class="row" style="margin:0"><select class="inp" id="rm" style="flex:1">${m.models.map(x => `<option>${x}</option>`).join("")}</select>
      <input class="inp" id="rmc" list="dl-models" style="flex:1.4" placeholder="…or type any id, e.g. gemini:<model>"></div>
    <label>Framework</label><select class="inp" id="rf">${m.frameworks.map(x => `<option>${x}</option>`).join("")}</select>
    <label>Inject fault</label><div class="row" style="margin:0"><select class="inp" id="rft" style="flex:1"><option>none</option>${m.fault_types.map(x => `<option>${x}</option>`).join("")}</select>
      <input class="inp" id="rfs" type="number" min="0" max="40" value="0" style="width:90px" title="Fault at step (0 = first compatible step)"></div>
    <div class="cap">Fault step: 0 means the first compatible step.</div><div id="rerr"></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="rcancel">Cancel</button><button class="primary" id="rgo">Run agent</button></div>`;
  $("#modal").classList.add("on");
  $("#rcancel").onclick = () => $("#modal").classList.remove("on");
  $("#rgo").onclick = async () => {
    const b = $("#rgo"); b.disabled = true; b.innerHTML = '<span class="spin"></span>Running agent…';
    try { const r = await api("/api/record", { task_id: $("#rt").value, model: $("#rmc").value.trim() || $("#rm").value, framework: $("#rf").value, fault_type: $("#rft").value, fault_step: +$("#rfs").value || null });
      await loadData(); $("#modal").classList.remove("on"); location.hash = "#/run/" + r.run_id; }
    catch (e) { $("#rerr").innerHTML = `<div class="note bad">${esc(e.message)}</div>`; b.disabled = false; b.textContent = "Run agent"; }
  };
}
$("#recBtn").onclick = openRecord;
$("#modal").onclick = e => { if (e.target.id === "modal") $("#modal").classList.remove("on"); };

/* ------------------------------------------------------------ boot + routing */
async function loadData() { [S.runs, S.replays] = await Promise.all([api("/api/runs"), api("/api/replays")]); if (!location.hash.replace(/^#\/?/, "")) { renderSide(); renderThreads(); renderOverview(); } }
async function loadMeta() {
  S.meta = await api("/api/meta");
  S.meta.models = withUserModels(S.meta.models);
  const s = S.meta.services, line = (ok, name, url, off) => `<div><span class="dot ${ok ? "up" : "down"}"></span><b>${name}</b><br>${ok ? esc(url.replace(/^https?:\/\//, "")) : off}</div>`;
  $("#svc").innerHTML = line(s.diagnose, "Diagnose API", S.meta.diagnose_url, "offline, using built-in mock") + line(s.replay, "Replay API", S.meta.replay_url, "offline, replaying in-process");
}
function route() {
  const h = location.hash.replace(/^#\/?/, ""); hideTip();
  $$(".nav").forEach(n => n.classList.toggle("on", n.dataset.go === (h === "results" ? "#/results" : h === "custom" ? "#/custom" : h === "keys" ? "#/keys" : "#/")));
  $("#side").style.display = h ? "none" : "";
  if (h.startsWith("run/")) openRun(decodeURIComponent(h.slice(4)));
  else if (h === "results") renderResults();
  else if (h === "custom") renderCustom();
  else if (h === "keys") renderKeys();
  else { D = null; renderActivity(); }
}
$$(".nav").forEach(n => n.onclick = () => location.hash = n.dataset.go);
addEventListener("hashchange", route);
(async () => {
  fillModelList();
  try { await loadMeta(); await loadData(); route(); setInterval(() => loadMeta().catch(() => {}), 20000); }
  catch (e) { $("#main").innerHTML = `<div class="empty">Could not load the dashboard data: ${esc(e.message)}</div>`; }
})();
</script>
</body>
